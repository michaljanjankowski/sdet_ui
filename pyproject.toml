[project]
name = "sdet-ui"
version = "0.1.0"
description = "Selenium UI test examples using pytest and the Page Object Pattern"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pychrome>=0.2.4,<0.3",
    "selenium>=4.49.0,<5",
    "selenium-page-factory>=2.8,<3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "ruff>=0.16.8",
    "pytest-xdist>=3.8,<4",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
